name: CI/CD Pipeline

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Least privilege by default; jobs opt into more only if they need it.
permissions:
  contents: read

# One run per ref: a new push cancels the in-flight run for that branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The Dockerfiles pin Node and pnpm separately, and Dependabot bumps the
      # base image without touching .tool-versions. Fail on drift so CI tests
      # the same versions production runs.
      - name: Check Node/pnpm versions match Dockerfiles
        run: |
          node_version=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)
          pnpm_version=$(jq -r '.packageManager | sub("^pnpm@"; "")' package.json)
          status=0
          for f in Dockerfile Dockerfile.dev; do
            for v in $(sed -nE 's/^FROM node:([0-9.]+)-alpine.*/\1/p' "$f"); do
              if [ "$v" != "$node_version" ]; then
                echo "::error file=$f::Node $v does not match .tool-versions ($node_version)"
                status=1
              fi
            done
            for v in $(sed -nE 's/.*pnpm@([0-9.]+).*/\1/p' "$f"); do
              if [ "$v" != "$pnpm_version" ]; then
                echo "::error file=$f::pnpm $v does not match packageManager ($pnpm_version)"
                status=1
              fi
            done
          done
          exit $status

      # Node/pnpm versions come from .tool-versions and package.json's
      # packageManager field — single source of truth, no drift with local dev.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      # tsc --noEmit + lint + coverage-gated tests. Emit is validated by the
      # Docker build, so there is no separate `pnpm build` step here.
      - name: Run quality checks (with coverage gate)
        run: pnpm quality:ci

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: quality-check
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          tags: devleo/wordsmith:latest
          # Persistent layer cache across runs — skips the slow better-sqlite3
          # source compile when dependencies are unchanged.
          cache-from: type=gha
          cache-to: type=gha,mode=max
