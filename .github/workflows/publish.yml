name: CI/CD Pipeline

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Least privilege by default; jobs opt into more only if they need it.
permissions:
  contents: read

# One run per ref: a new push cancels the in-flight run for that branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node and pnpm are pinned in .tool-versions/package.json and again in
      # both Dockerfiles, and are bumped by hand. Fail on drift so CI tests the
      # same versions production runs.
      - name: Check Node/pnpm versions match Dockerfiles
        run: |
          node_version=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)
          pnpm_version=$(jq -r '.packageManager | sub("^pnpm@"; "")' package.json)
          status=0
          for f in Dockerfile Dockerfile.dev; do
            for v in $(sed -nE 's/^FROM node:([0-9.]+)-alpine.*/\1/p' "$f"); do
              if [ "$v" != "$node_version" ]; then
                echo "::error file=$f::Node $v does not match .tool-versions ($node_version)"
                status=1
              fi
            done
            for v in $(sed -nE 's/.*pnpm@([0-9.]+).*/\1/p' "$f"); do
              if [ "$v" != "$pnpm_version" ]; then
                echo "::error file=$f::pnpm $v does not match packageManager ($pnpm_version)"
                status=1
              fi
            done
          done
          exit $status

      # Node/pnpm versions come from .tool-versions and package.json's
      # packageManager field — single source of truth, no drift with local dev.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      # tsc --noEmit + lint + coverage-gated tests. Emit is validated by the
      # Docker build in the image job, so there is no `pnpm build` step here.
      - name: Run quality checks (with coverage gate)
        run: pnpm quality:ci

  # Builds the production image on every run so a broken Dockerfile fails the
  # PR, not the master push. Only pushes to master log in and publish the
  # image. Deploying to the server is a separate manual step.
  image:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: quality-check
    timeout-minutes: 15
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # :latest for the server, and the short commit SHA to roll back to.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: devleo/wordsmith
          tags: |
            type=raw,value=latest
            type=raw,value=master-{{sha}}

      - name: Build image (and push on master)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attestations are attached to the pushed image only.
          sbom: ${{ env.PUBLISH == 'true' }}
          provenance: ${{ env.PUBLISH == 'true' }}
          # Persistent layer cache across runs; skips reinstalling dependencies
          # when the lockfile is unchanged.
          cache-from: type=gha
          cache-to: type=gha,mode=max
