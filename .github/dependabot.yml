version: 2
# No "docker" ecosystem: the Node version is pinned in .tool-versions and both
# Dockerfiles, and Dependabot can only bump the Dockerfiles. Bump Node by hand
# in all three places (CI's version check fails if they disagree).
updates:
  # Application dependencies (pnpm lockfile is handled by the npm ecosystem)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      # One PR for routine dev-tooling bumps to cut noise.
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions used in the CI/CD workflow
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
